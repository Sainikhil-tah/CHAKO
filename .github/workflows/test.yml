name: Chess Engine Test

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:

      games:
        description: "Number of Games"
        required: true
        default: "100"

      my_depth:
        description: "My Engine Depth"
        required: true
        default: "4"

      move_time:
        description: "Move Time (seconds)"
        required: true
        default: "2.0"

      sf_elo:
        description: "Stockfish Elo"
        required: true
        default: "1800"

      sf_depth:
        description: "Stockfish Depth"
        required: true
        default: "8"

      print_moves:
        description: "Print every move (True/False)"
        required: true
        default: "False"

      print_final_board:
        description: "Print final board (True/False)"
        required: true
        default: "True"

      report_name:
        description: "Report filename"
        required: true
        default: "benchmark"

jobs:
  test:

    runs-on: ubuntu-latest
    steps:

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Install build tools
      run: |
        sudo apt update
        sudo apt install -y g++ make

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Stockfish
      run: |
        sudo apt install -y stockfish

    - name: Install dependencies
      run: |
        pip install python-chess

    - name: Build engine
      run: |
        make

    - name: Verify build
      run: |
        ls -l
        chmod +x ./chess
        ./chess uci

    - name: Run automated test
      env:
        NUM_GAMES: ${{ github.event.inputs.games }}
        GAME_DEPTH: ${{ github.event.inputs.my_depth }}
        TIME_LIMIT: ${{ github.event.inputs.move_time }}
        STOCKFISH_ELO: ${{ github.event.inputs.sf_elo }}
        STOCKFISH_DEPTH: ${{ github.event.inputs.sf_depth }}
        PRINT_MOVES: ${{ github.event.inputs.print_moves }}
        PRINT_FINAL_BOARD: ${{ github.event.inputs.print_final_board }}
        REPORT_NAME: ${{ github.event.inputs.report_name }}
      run: |
        python automation_scripts/test_git.py

    - name: Commit reports
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add testing_reports/

        git diff --cached --quiet || git commit -m "add testing report"

        git pull --rebase

        git push
